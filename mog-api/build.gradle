plugins {
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'java'
}

dependencies {
    implementation project(':mog-contract')
    implementation project(':mog-core')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('apiLargeReportValidation', JavaExec) {
    group = 'verification'
    description = 'Runs a developer-only API lifecycle validation for a production-shaped streaming XLSX report.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.copperforge.mog.api.benchmark.ApiLargeReportValidation'

    args '--totalRows', project.findProperty('totalRows') ?: '14194708',
            '--sheetCount', project.findProperty('sheetCount') ?: '15',
            '--columns', project.findProperty('columns') ?: '10',
            '--rowWindow', project.findProperty('rowWindow') ?: '100',
            '--fetchSize', project.findProperty('fetchSize') ?: '1000',
            '--workers', project.findProperty('workers') ?: '1',
            '--queueCapacity', project.findProperty('queueCapacity') ?: '10',
            '--deleteOutput', project.findProperty('deleteOutput') ?: 'true',
            '--validateZip', project.findProperty('validateZip') ?: 'true',
            '--smallValidationRows', project.findProperty('smallValidationRows') ?: '1000',
            '--smallValidationSheets', project.findProperty('smallValidationSheets') ?: '3'
}
