buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.liquibase:liquibase-gradle-plugin:2.2.1"
    }
}

plugins {
	id 'java'
    id 'maven-publish'
    id 'application'
    id "com.netflix.nebula.rpm" version "11.9.1"
}

apply plugin: 'org.liquibase.gradle'

group = 'org.copperforge'
version = '0.0.1'

repositories {
	mavenCentral()
    mavenLocal()
}

dependencies {
    implementation 'org.slf4j:slf4j-api:2.0.13'
    implementation 'ch.qos.logback:logback-core:1.5.6'
    implementation 'ch.qos.logback:logback-classic:1.5.6'

    implementation 'com.google.guava:guava:33.2.1-jre'    
    implementation 'org.apache.poi:poi:5.3.0'
    implementation 'org.apache.poi:poi-ooxml:5.3.0'

    implementation 'com.fasterxml.jackson.core:jackson-core:2.17.2'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.17.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

    implementation 'org.json:json:20240303'
    implementation 'com.jayway.jsonpath:json-path:2.9.0'

    implementation 'com.h2database:h2:2.2.224'
    implementation 'org.xerial:sqlite-jdbc:3.46.0.0'
    implementation 'com.oracle:ojdbc8:21.11'

    implementation 'com.github.jsqlparser:jsqlparser:5.0'

    implementation 'org.eclipse.jgit:org.eclipse.jgit:6.10.0.202406032230-r'
    implementation 'org.eclipse.jgit:org.eclipse.jgit.ssh.apache:6.10.0.202406032230-r'
 
    implementation 'io.undertow:undertow-core:2.3.15.Final'
    implementation 'io.undertow:undertow-servlet:2.3.15.Final'

    implementation 'info.picocli:picocli:4.7.6'
    implementation 'info.picocli:picocli-shell-jline3:4.7.6'
    annotationProcessor 'info.picocli:picocli-codegen:4.7.6'
    liquibaseRuntime 'info.picocli:picocli:4.7.6'

    liquibaseRuntime 'org.liquibase:liquibase-core:4.28.0'
    liquibaseRuntime 'org.liquibase:liquibase-groovy-dsl:3.0.3'
    liquibaseRuntime 'org.yaml:snakeyaml:2.2'
    liquibaseRuntime 'com.h2database:h2:2.2.224'
    liquibaseRuntime 'javax.xml.bind:jaxb-api:2.3.11'

    testImplementation("org.junit.jupiter:junit-jupiter:5.9.2")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")

    testImplementation("org.junit.jupiter:junit-jupiter:5.9.2")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'org.copperforge'
            artifactId = 'mog'
            version = '0.0.1'

            from components.java
        }
    }
}

application {
    mainClass = 'org.copperforge.mog.Mog'
}


jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.RSA', 'META-INF/*.SF','META-INF/*.DSA' 

    manifest {
        attributes 'Main-Class': 'org.copperforge.mog.Mog'
    }

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

task rpm(type: Rpm) {
    dependsOn('build')
    os LINUX
    into "/opt/mog"
    arch 'x86_64'
    packageName project.name
    release "alpha"
    preInstall file("src/install/scripts/pre-install.sh")
    postInstall file("src/install/scripts/post-install.sh")

    user "mog"
    group "mog"
    permissionGroup "mog"

    from (fileTree(dir: ".", includes: [ "mog" ])) {
        into "bin"
        fileMode 0775
    }

    from (fileTree(dir: "build/libs/mog-0.0.1.jar")) {
        into "lib"
        fileMode 0664
        rename "mog-0.0.1.jar", "mog.jar"
    }

    from (fileTree(dir: "src/main/resources/commands")) {
        into "etc/commands"
        fileMode 0664
    }

    from (fileTree(dir: "src/main/resources/reports")) {
        into "etc/reports"
        fileMode 0664
    }

    from (fileTree(dir: "src/install/resources/etc")) {
        addParentDirs false
        into "/etc"
        fileMode 0664
    }

    from (fileTree(dir: "src/install/resources", include: "config.mog")) {
        into "etc"
        fileMode 0664
    }

}