buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.liquibase:liquibase-gradle-plugin:2.2.1"
    }
}

plugins {
	id 'java'
    id 'maven-publish'
    id 'application'
    id "com.netflix.nebula.rpm" version "11.9.1"
}

apply plugin: 'org.liquibase.gradle'

class ApplicationVersion {
   Integer major
   Integer minor
   Integer patch
   Boolean release

   ApplicationVersion(Integer major, Integer minor, Integer patch, Boolean release) {
      this.major = major
      this.minor = minor
      this.patch = patch
      this.release = release
   }

   private String getRelease() {
    def date = new Date()

    return this.release ? 'beta' : date.format('yyyyMMddHHmmss')
   }

   String getVersion() {
      def version = "$major.$minor.$patch"
      return "$version"
   }

   String getReleaseVersion() {
      def version = this.getVersion()
      if (this.getRelease() != '') version += "." + this.getRelease()
      return "$version"
   }
}

ext {
    applicationVersion = new ApplicationVersion(1, 0, 0, true);
}

group = 'org.copperforge.mog'
version = applicationVersion.getReleaseVersion();

repositories {
	mavenCentral()
    mavenLocal()
}

dependencies {
    implementation "org.slf4j:slf4j-api:2.+"
    implementation "ch.qos.logback:logback-core:1.+"
    implementation "ch.qos.logback:logback-classic:1.+"

    implementation "com.google.guava:guava:33.2.1-jre"    

    implementation "org.bouncycastle:bcprov-jdk18on:1.+"
    implementation "org.bouncycastle:bcpkix-jdk18on:1.+"

    implementation "commons-io:commons-io:2.+"
    implementation "org.apache.commons:commons-compress:1.+"
    implementation "org.apache.poi:poi:5.+" 
    implementation "org.apache.poi:poi-ooxml:5.+" 

    implementation "com.fasterxml.jackson.core:jackson-core:2.17.+"
    implementation "com.fasterxml.jackson.core:jackson-annotations:2.17.+"
    implementation "com.fasterxml.jackson.core:jackson-databind:2.17.+"

    implementation "org.json:json:+"
    implementation "com.jayway.jsonpath:json-path:2.+"

    implementation "com.h2database:h2:2.+"
    implementation "org.xerial:sqlite-jdbc:3.+"

    implementation "com.github.jsqlparser:jsqlparser:5.+"

    implementation "org.eclipse.jgit:org.eclipse.jgit:7.+"
    implementation "org.eclipse.jgit:org.eclipse.jgit.ssh.apache:7.+"
 
    implementation "info.picocli:picocli:4.+"
    annotationProcessor "info.picocli:picocli-codegen:4.+"
    liquibaseRuntime "info.picocli:picocli:4.+"

    liquibaseRuntime "org.liquibase:liquibase-core:4.+"
    liquibaseRuntime "org.liquibase:liquibase-groovy-dsl:3.+"
    liquibaseRuntime "org.yaml:snakeyaml:2.+"
    liquibaseRuntime "com.h2database:h2:2.+"
    liquibaseRuntime "javax.xml.bind:jaxb-api:2.+"

    testImplementation("org.junit.jupiter:junit-jupiter:5.+")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")

    testImplementation("org.junit.jupiter:junit-jupiter:5.+")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'org.copperforge'
            artifactId = 'mog'
            version = applicationVersion.getVersion()

            from components.java
        }
    }
}

application {
    mainClass = 'org.copperforge.mog.Mog'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.RSA', 'META-INF/*.SF','META-INF/*.DSA' 

    archiveFileName = "mog.jar"
    manifest {
        attributes(
            'Main-Class': 'org.copperforge.mog.Mog',
            'Implementation-Title': 'MOG - It is what you make it',
            'Implementation-Version': "${version}"
        )
    }

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

compileJava {
    sourceCompatibility = "21"
    targetCompatibility = "21"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

task rpm(type: Rpm) {
    dependsOn('build')
    os LINUX
    into "/opt/mog"
    arch 'x86_64'
    packageName project.name
    preInstall file("src/install/scripts/pre-install.sh")
    postInstall file("src/install/scripts/post-install.sh")
    version applicationVersion.getVersion()
    release applicationVersion.getRelease()

    user "mog"
    group "mog"
    permissionGroup "mog"

    from (fileTree(dir: "src/main/bin", include: "*")) {
        into "bin"
        fileMode 0777
    }

    from (fileTree(dir: "build/libs", include: "*.jar")) {
        into "lib"
        fileMode 0664
    }

    from (fileTree(dir: "src/main/resources/commands")) {
        into "etc/commands"
        fileMode 0664
    }

    from (fileTree(dir: "src/main/resources/reports")) {
        into "etc/reports"
        fileMode 0664
    }

    from (fileTree(dir: "src/install/resources/etc")) {
        addParentDirs false
        into "/etc"
        fileMode 0664
    }

    from (fileTree(dir: "src/install/resources", include: "config.mog")) {
        into "etc"
        fileMode 0664
    }

}