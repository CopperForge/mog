<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">MOG Console</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body th:fragment="body">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" th:href="@{/ui}">
                <img th:src="@{/img/mog.png}" alt="Mog" class="mog-brand me-2">
                <span>MOG Console</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMog">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMog">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" th:classappend="${activePage}=='dashboard' ? ' active'" th:href="@{/ui}">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" th:classappend="${activePage}=='datasources' ? ' active'" th:href="@{/ui/datasources}">Datasources</a></li>
                    <li class="nav-item"><a class="nav-link" th:classappend="${activePage}=='reports' ? ' active'" th:href="@{/ui/reports}">Reports</a></li>
                    <li class="nav-item"><a class="nav-link" th:classappend="${activePage}=='runs' ? ' active'" th:href="@{/ui/runs}">Runs</a></li>
                    <li class="nav-item"><a class="nav-link" th:classappend="${activePage}=='swagger' ? ' active'" th:href="@{/ui/swagger}">Swagger</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container py-4">
        <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>
        <div th:insert="~{::content}"></div>
    </div>
    <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/forms.js}"></script>
</body>
</html>
