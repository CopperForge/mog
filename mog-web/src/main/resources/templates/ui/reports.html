<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('MOG Console · Reports')"></head>
<body>
<div th:replace="fragments/layout :: body">
    <div th:fragment="content" class="row g-4">
        <div class="col-lg-4">
            <div class="card h-100">
                <div class="card-header">Existing reports</div>
                <div class="card-body">
                    <div th:if="${#lists.isEmpty(reportIds)}" class="text-center text-muted">
                        <img th:src="@{/img/mog.png}" alt="Mog" class="empty-state-img mb-3">
                        <p>No reports uploaded yet.</p>
                    </div>
                    <div th:unless="${#lists.isEmpty(reportIds)}" class="list-group list-group-flush">
                        <a th:each="id : ${reportIds}"
                           class="list-group-item list-group-item-action"
                           th:href="@{'/ui/reports/' + ${id}}"
                           th:text="${id}"></a>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-8">
            <div class="card h-100">
                <div class="card-header">Upload report DSL</div>
                <div class="card-body">
                    <form th:action="@{/ui/reports}" method="post" enctype="multipart/form-data" th:object="${form}">
                        <div class="mb-3">
                            <label class="form-label">JSON DSL</label>
                            <textarea class="form-control" rows="12" th:field="*{jsonText}" placeholder="Paste report JSON here..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Upload file (.json)</label>
                            <input type="file" class="form-control" th:field="*{file}" data-json-file>
                        </div>
                        <div class="d-flex justify-content-end">
                            <button type="submit" class="btn btn-primary">Save report</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-12" th:if="${selectedReport}">
            <div class="card">
                <div class="card-header">Report <span th:text="${selectedId}"></span></div>
                <div class="card-body">
                    <pre class="mb-0"><code th:text="${selectedReport}"></code></pre>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
