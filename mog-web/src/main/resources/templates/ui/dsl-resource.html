<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${resourceType.pageTitle})}"></head>
<body>
<div th:replace="~{fragments/layout :: body}">
    <div th:fragment="content" class="row g-4">
        <div class="col-lg-4">
            <div class="card h-100">
                <div class="card-header" th:text="${resourceType.listTitle}">Existing resources</div>
                <div class="card-body">
                    <div th:if="${#lists.isEmpty(resourceIds)}" class="text-center text-muted">
                        <img th:src="@{/img/mog.png}" alt="Mog" class="empty-state-img mb-3">
                        <p th:text="${resourceType.emptyMessage}">No resources yet.</p>
                    </div>
                    <div th:unless="${#lists.isEmpty(resourceIds)}" class="list-group list-group-flush">
                        <a th:each="id : ${resourceIds}"
                           class="list-group-item list-group-item-action"
                           th:href="@{${resourceBasePath} + '/' + ${id}}"
                           th:text="${id}"></a>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-8">
            <div class="card h-100">
                <div class="card-header" th:text="${resourceType.uploadTitle}">Upload DSL</div>
                <div class="card-body">
                    <form th:action="@{${resourceBasePath}}" method="post" enctype="multipart/form-data" th:object="${form}">
                        <div class="mb-3">
                            <label class="form-label">JSON DSL</label>
                            <textarea class="form-control"
                                      th:rows="${resourceType.textareaRows}"
                                      th:field="*{jsonText}"
                                      th:placeholder="${resourceType.textareaPlaceholder}"></textarea>
                            <div th:if="${resourceType.textareaHelp}" class="form-text" th:text="${resourceType.textareaHelp}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Upload file (.json)</label>
                            <input type="file" class="form-control" th:field="*{file}" data-json-file>
                        </div>
                        <div class="d-flex justify-content-end">
                            <button type="submit" class="btn btn-primary" th:text="${resourceType.submitLabel}">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-12" th:if="${selectedJson}">
            <div class="card">
                <div class="card-header"><span th:text="${resourceType.singularLabel}">Resource</span> <span th:text="${selectedId}"></span></div>
                <div class="card-body">
                    <pre class="mb-0"><code th:text="${selectedJson}"></code></pre>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
