# Repository settings for mog
# This file documents the recommended branch protection rules for this repository.
# 
# Note: These settings should be applied via GitHub UI or API.
# See: https://docs.github.com/en/rest/repos/rules
#
# To apply these settings via GitHub UI:
# 1. Go to Settings > Branches
# 2. Add rule for branch name pattern: main
# 3. Configure protection rules as documented below

repository:
  name: mog
  description: "A small, batteries-included CLI to define data-driven reports and export them to XLSX"
  homepage: https://github.com/CopperForge/mog
  
  # Security settings
  private: false
  has_issues: true
  has_projects: true
  has_wiki: true
  has_downloads: true
  
  # Require vulnerability alerts
  enable_vulnerability_alerts: true
  enable_automated_security_fixes: true

# Branch protection rules for 'main' branch
branches:
  - name: main
    protection:
      # Require pull request reviews before merging
      required_pull_request_reviews:
        # Dismiss stale reviews when new commits are pushed
        dismiss_stale_reviews: true
        # Require review from code owners (as defined in CODEOWNERS file)
        require_code_owner_reviews: true
        # Number of required approving reviews
        required_approving_review_count: 1
        # Restrict who can dismiss pull request reviews
        restrict_dismissals: true
        dismissal_restrictions:
          users: []
          teams: ["admins"]  # Replace with actual team name(s) from your organization
      
      # Require status checks to pass before merging
      required_status_checks:
        # Require branches to be up to date before merging
        strict: true
        # List of required status checks (from GitHub Actions workflows)
        # Note: Actual status check names are generated by GitHub and may include matrix values
        # Common format: "workflow-name / job-name (matrix-value)"
        # Verify actual names in GitHub UI under Settings → Branches → Status checks
        contexts:
          - "Build and Test (Java 21) (ubuntu-latest)"
          - "Build and Test (Java 21) (windows-latest)"
          - "build"
      
      # Enforce restrictions on who can push to the branch
      enforce_admins: true
      
      # Prevent force pushes to the branch
      allow_force_pushes: false
      
      # Prevent deletion of the branch
      allow_deletions: false
      
      # Require signed commits (recommended for high-security environments)
      required_signatures: false
      
      # Require linear history (no merge commits)
      required_linear_history: false
      
      # Restrict who can push to matching branches
      # Note: Team names must exist in the @CopperForge organization
      # Create teams via Settings → Teams before applying these restrictions
      restrictions:
        users: []
        teams: ["admins"]  # Replace with actual team name(s) from your organization
        apps: []
      
      # Require conversation resolution before merging
      required_conversation_resolution: true
      
      # Lock branch (no one can push, including admins)
      lock_branch: false
