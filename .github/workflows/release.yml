name: Installers

on:
  push:
    tags:
      - 'v*'
      - '1.*'

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      on_main: ${{ steps.tag_check.outputs.on_main }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tagged commit is on main
        id: tag_check
        shell: bash
        run: |
          git fetch --no-tags origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_main=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${GITHUB_REF_NAME} does not point to a commit on main; skipping packaging."
          fi

  build-rpm:
    needs: validate-tag
    if: needs.validate-tag.outputs.on_main == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Build RPM
        uses: gradle/gradle-build-action@v2
        with:
          arguments: clean :mog-cli:rpm --no-daemon

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: mog-rpm
          path: mog-cli/build/distributions/*.rpm

  build-windows-installer:
    needs: validate-tag
    if: needs.validate-tag.outputs.on_main == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        uses: gradle/gradle-build-action@v2
        with:
          arguments: clean :mog-cli:windowsInstaller --no-daemon --console=plain

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: mog-windows-installer
          path: mog-cli/build/distributions/*.exe

  github-release:
    runs-on: ubuntu-latest
    needs:
      - validate-tag
      - build-rpm
      - build-windows-installer
    if: needs.validate-tag.outputs.on_main == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: mog-rpm
          path: dist

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: mog-windows-installer
          path: dist

      - name: Generate release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" {print; p=1; next}
            p && $0 ~ "^## \\\[" {exit}
            p {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          echo "Using release notes for version: $VER" && echo "---" && cat RELEASE_NOTES.md && echo "---"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
