name: Installers

on:
  push:
    tags:
      - 'v*'
      - '1.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package and release
        required: true
        type: string

jobs:
  build-rpm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Build RPM
        uses: gradle/gradle-build-action@v2
        with:
          arguments: clean :mog-cli:rpm --no-daemon

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: mog-rpm
          path: mog-cli/build/distributions/*.rpm

  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        uses: gradle/gradle-build-action@v2
        with:
          arguments: clean :mog-cli:windowsInstaller --no-daemon --console=plain

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: mog-windows-installer
          path: mog-cli/build/distributions/*.exe

  github-release:
    runs-on: ubuntu-latest
    needs:
      - build-rpm
      - build-windows-installer
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0

      - name: Download RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: mog-rpm
          path: dist

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: mog-windows-installer
          path: dist

      - name: Generate release notes from CHANGELOG
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" {print; p=1; next}
            p && $0 ~ "^## \\\[" {exit}
            p {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          echo "Using release notes for version: $VER" && echo "---" && cat RELEASE_NOTES.md && echo "---"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
