import java.util.Locale

plugins {
    id 'application'
    id 'com.netflix.nebula.rpm' version '11.9.1'
    id 'org.liquibase.gradle' version '2.2.1'
}

evaluationDependsOn(':mog-api')
evaluationDependsOn(':mog-web')

def appVersion = rootProject.ext.applicationVersion
def mainEntryPoint = 'org.copperforge.mog.Mog'
def linuxInstallRoot = '/opt/mog'
def windowsInstallRoot = 'C:\\opt\\mog'
def stagedInstallDir = layout.buildDirectory.dir('installer/stage')
def renderedWindowsInstallerDir = layout.buildDirectory.dir('installer/windows')
def windowsInstallerOutputName = "mog-${project.version}-windows-x64-installer"
def mogApiBootJar = project(':mog-api').tasks.named('bootJar')
def mogWebBootJar = project(':mog-web').tasks.named('bootJar')
def isWindows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
def setFileModeIfSupported = { spec, int mode ->
    def metaProp = spec.metaClass.hasProperty(spec, 'fileMode')
    if (metaProp) {
        spec.fileMode = mode
    } else if (spec.metaClass.respondsTo(spec, 'setFileMode', Integer.TYPE)) {
        spec.setFileMode(mode)
    }
}
def resolveIsccExecutable = {
    def configured = System.getenv('ISCC_EXE')
    if (configured) {
        return configured
    }

    [
        'C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe',
        'C:\\Program Files\\Inno Setup 6\\ISCC.exe'
    ].find { new File(it).exists() }
}
def addPackagedContent = { spec ->
    spec.from('src/main/bin') {
        into 'bin'
        setFileModeIfSupported(delegate, 0755)
    }
    spec.from('src/install/resources/config.mog') {
        into 'etc'
        setFileModeIfSupported(delegate, 0644)
    }
    spec.from('src/install/resources/etc') {
        into 'etc'
        exclude 'profile.d/**'
        setFileModeIfSupported(delegate, 0644)
    }
    spec.from('src/main/examples') {
        into 'examples'
        setFileModeIfSupported(delegate, 0644)
    }
    spec.from(rootProject.file('INSTALL.md')) {
        into 'docs'
        setFileModeIfSupported(delegate, 0644)
    }
    spec.from(rootProject.file('README.md')) {
        into 'docs'
        setFileModeIfSupported(delegate, 0644)
    }
    spec.from(rootProject.file('LICENSE')) {
        into 'docs'
        setFileModeIfSupported(delegate, 0644)
    }
}

dependencies {
    implementation project(':mog-core')

    implementation "info.picocli:picocli:4.7.6"
    annotationProcessor "info.picocli:picocli-codegen:4.7.6"

    liquibaseRuntime "info.picocli:picocli:4.7.6"
    liquibaseRuntime "org.liquibase:liquibase-core:4.27.0"
    liquibaseRuntime "org.liquibase:liquibase-groovy-dsl:3.0.3"
    liquibaseRuntime "org.yaml:snakeyaml:2.2"
    liquibaseRuntime "com.h2database:h2:2.2.224"
    liquibaseRuntime "javax.xml.bind:jaxb-api:2.3.1"
}

application {
    applicationName = 'mog'
    mainClass = mainEntryPoint
    applicationDefaultJvmArgs = ["-Dmog.version=${project.version}"]
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.RSA', 'META-INF/*.SF','META-INF/*.DSA'

    archiveFileName = "mog.jar"
    manifest {
        attributes(
            'Main-Class': mainEntryPoint,
            'Implementation-Title': 'MOG - It is what you make it',
            'Implementation-Version': project.version
        )
    }

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

distributions {
    main {
        contents {
            exclude 'bin/**'
            addPackagedContent(delegate)
        }
    }
}

tasks.named('jar') {
    dependsOn ':mog-core:jar'
}

tasks.withType(org.gradle.jvm.application.tasks.CreateStartScripts).configureEach {
    enabled = false
}

tasks.register('stageInstallTree', Sync) {
    group = 'distribution'
    description = 'Stages the install tree used by Linux and Windows installers.'
    dependsOn 'jar', mogApiBootJar, mogWebBootJar
    into stagedInstallDir

    addPackagedContent(delegate)

    from(tasks.named('jar')) {
        into 'lib'
        setFileModeIfSupported(delegate, 0644)
    }

    from(mogApiBootJar) {
        into 'services/api'
        rename { 'mog-api.jar' }
        setFileModeIfSupported(delegate, 0644)
    }

    from(mogWebBootJar) {
        into 'services/web'
        rename { 'mog-web.jar' }
        setFileModeIfSupported(delegate, 0644)
    }
}

tasks.register('renderWindowsInstallerScript', Copy) {
    group = 'distribution'
    description = 'Renders the Inno Setup script used to build the Windows installer.'
    dependsOn 'stageInstallTree'
    from('src/install/windows') {
        include 'mog.iss'
    }
    into renderedWindowsInstallerDir
    filteringCharset = 'UTF-8'
    filter { line ->
        line
            .replace('@APP_NAME@', application.applicationName)
            .replace('@APP_VERSION@', project.version.toString())
            .replace('@DEFAULT_INSTALL_DIR@', windowsInstallRoot)
            .replace('@OUTPUT_BASE_FILENAME@', windowsInstallerOutputName)
    }
}

tasks.register('windowsInstaller', Exec) {
    group = 'distribution'
    description = 'Builds a Windows installer that defaults to C:\\opt\\mog or MOG_HOME when present.'
    dependsOn 'renderWindowsInstallerScript'
    onlyIf { isWindows }

    doFirst {
        def isccExecutable = resolveIsccExecutable()
        if (!isccExecutable) {
            throw new GradleException('ISCC.exe not found. Install Inno Setup 6 or set ISCC_EXE.')
        }

        commandLine isccExecutable, renderedWindowsInstallerDir.get().file('mog.iss').asFile.absolutePath
    }
}

tasks.register('sampleReport', JavaExec) {
    group = 'application'
    description = 'Assembles and generates the sample chart report into the project directory.'
    dependsOn 'assemble'
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set(mainEntryPoint)
    def envName = (project.findProperty('env') ?: System.getenv('MOG_ENV'))
    def mogHomeDir = rootProject.layout.projectDirectory.asFile
    workingDir = mogHomeDir
    environment 'MOG_HOME', mogHomeDir.absolutePath
    systemProperty 'mog.version', project.version
    if (envName) {
        environment 'MOG_ENV', envName
    }
    doFirst {
        def etcDir = new File(mogHomeDir, 'etc')
        def reportsDir = new File(etcDir, 'reports')
        reportsDir.mkdirs()
        copy {
            from 'src/main/examples/reports/chart.sample.report.mog'
            into reportsDir
        }
        def cfgSrc = file('src/install/resources/config.mog')
        def cfgDst = new File(etcDir, 'config.mog')
        if (!cfgDst.exists() && cfgSrc.exists()) {
            copy { from cfgSrc; into etcDir }
        }
        def dsSrc = file('src/install/resources/etc/datasources.mog')
        def dsDst = new File(etcDir, 'datasources.mog')
        if (!dsDst.exists() && dsSrc.exists()) {
            copy { from dsSrc; into etcDir }
        }
        if (envName) {
            def envTemplate = file("src/install/resources/etc/datasources.${envName}.mog")
            if (envTemplate.exists()) {
                copy { from envTemplate; into etcDir }
            } else {
                logger.lifecycle("[sampleReport] No env-specific catalog template found at ${envTemplate}. Proceeding without env seed.")
            }
        }
        def salesSrc = file('src/install/resources/etc/sales.json')
        def salesDst = new File(etcDir, 'sales.json')
        if (!salesDst.exists() && salesSrc.exists()) {
            copy { from salesSrc; into etcDir }
        }
        args = [
            "--datasources=${etcDir.absolutePath}"
        ]
        if (envName) {
            args += "--env=${envName}"
        }
        args += [
            'report',
            'generate',
            '--report=chart.sample.report.mog'
        ]
    }
}

tasks.register('rpm', Rpm) {
    dependsOn 'stageInstallTree'
    os LINUX
    arch 'noarch'
    packageName rootProject.name
    version appVersion.getVersion()
    release appVersion.getRelease()
    packageDescription = 'MOG command-line distribution'
    prefix linuxInstallRoot
    into linuxInstallRoot
    directory linuxInstallRoot, 0755

    from(stagedInstallDir.map { it.dir('bin') }) {
        into 'bin'
        setFileModeIfSupported(delegate, 0777)
    }

    from(stagedInstallDir.map { it.dir('lib') }) {
        into 'lib'
        setFileModeIfSupported(delegate, 0664)
    }

    from(stagedInstallDir.map { it.dir('etc') }) {
        into 'etc'
        setFileModeIfSupported(delegate, 0664)
    }

    from(stagedInstallDir.map { it.dir('examples') }) {
        into 'examples'
        setFileModeIfSupported(delegate, 0664)
    }

    from(stagedInstallDir.map { it.dir('services') }) {
        into 'services'
        setFileModeIfSupported(delegate, 0664)
    }

    from(stagedInstallDir.map { it.dir('docs') }) {
        into 'docs'
        setFileModeIfSupported(delegate, 0664)
    }
}
